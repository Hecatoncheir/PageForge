name: Пакеты релиза

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Проверочная версия (например, v0.1.0). Пусто — версия из pubspec.yaml.'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name || github.run_id }}
  cancel-in-progress: false

jobs:
  build:
    name: Подготовить пакеты браузеров
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.version || '' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.release.tag_name || github.sha }}
          persist-credentials: false

      - uses: ./.github/actions/build

      - name: Сохранить пакеты
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pageforge-release
          path: release/*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Прикрепить файлы к релизу
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: pageforge-release
          path: release

      - name: Загрузить архивы и контрольные суммы
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" release/*.zip release/SHA256SUMS.txt --clobber

