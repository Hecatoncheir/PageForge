name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      verify_public_repository:
        description: 'Проверить загрузку и релизы настоящего PageForge-github.com через сеть'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Проверка и сборка
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PAGEFORGE_TEST_REPOSITORY: ${{ inputs.verify_public_repository && 'https://github.com/Hecatoncheir/PageForge-github.com' || '' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: ./.github/actions/build

      - name: Сохранить снимки проверок
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pageforge-screenshots
          path: |
            work/browser-checks/
            work/design-checks/
          if-no-files-found: ignore
          retention-days: 7

      - name: Сохранить пакеты
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pageforge-packages
          path: release/*
          if-no-files-found: error
          retention-days: 14

