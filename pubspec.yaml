name: pageforge
description: Персональные варианты отображения сайтов.
publish_to: none
version: 0.2.2+5

environment:
  sdk: ^3.13.0

dependencies:
  collection: 1.19.1
  flutter:
    sdk: flutter
  flutter_bloc: 9.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - design/assets/logo-cream.png
    - design/assets/logo-ink.png
  fonts:
    - family: Nunito
      fonts:
        - asset: design/assets/fonts/Nunito-Variable.ttf
    - family: NunitoSans
      fonts:
        - asset: design/assets/fonts/NunitoSans-Variable.ttf
    - family: Roboto
      fonts:
        - asset: design/assets/fonts/NunitoSans-Variable.ttf
    - family: JetBrainsMono
      fonts:
        - asset: design/assets/fonts/JetBrainsMono-Variable.ttf

